name: Update Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Profile Statistics Update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > temp_update.js
          const fs = require('fs');
          const path = require('path');

          const USERNAME = '18bharathkumar';
          const README_PATH = path.join(process.cwd(), 'README.md');
          const ASSETS_DIR = path.join(process.cwd(), '.github', 'assets');

          // Helper to format numbers (e.g. 1000 -> 1,000)
          function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
          }

          // Fetch GitHub GraphQL Data
          async function fetchGithubData(username, token) {
            const query = `
              query($username: String!) {
                user(login: $username) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          color
                          contributionCount
                          date
                          weekday
                        }
                      }
                    }
                    totalCommitContributions
                    totalPullRequestContributions
                    totalIssueContributions
                    totalRepositoryContributions
                  }
                }
              }
            `;

            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: {
                'Authorization': `bearer ${token}`,
                'Content-Type': 'application/json',
                'User-Agent': '18bharathkumar-stats-updater'
              },
              body: JSON.stringify({
                query,
                variables: { username }
              })
            });

            if (!response.ok) {
              const text = await response.text();
              throw new Error(`GitHub API request failed: ${response.status} ${response.statusText}\n${text}`);
            }

            const result = await response.json();
            if (result.errors) {
              throw new Error(`GitHub API returned errors:\n${JSON.stringify(result.errors, null, 2)}`);
            }

            return result.data;
          }

          // Generate Mock/Demo Data for Local Testing
          function generateMockData() {
            const today = new Date();
            const endDate = new Date(today);
            const startDate = new Date(today);
            startDate.setDate(startDate.getDate() - 365); // 1 year ago

            // Align start date to Sunday
            while (startDate.getDay() !== 0) {
              startDate.setDate(startDate.getDate() - 1);
            }

            const weeks = [];
            let currentWeek = { contributionDays: [] };

            const cur = new Date(startDate);
            while (cur <= endDate) {
              const isWeekend = cur.getDay() === 0 || cur.getDay() === 6;
              const probability = isWeekend ? 0.9 : 0.6;
              const contributionCount = Math.random() < probability ? 0 : Math.floor(Math.random() * 8) + 1;

              currentWeek.contributionDays.push({
                contributionCount,
                date: cur.toISOString().split('T')[0],
                weekday: cur.getDay()
              });

              if (cur.getDay() === 6) {
                weeks.push(currentWeek);
                currentWeek = { contributionDays: [] };
              }

              cur.setDate(cur.getDate() + 1);
            }

            if (currentWeek.contributionDays.length > 0) {
              weeks.push(currentWeek);
            }

            const totalContributions = weeks.reduce((sum, w) =>
              sum + w.contributionDays.reduce((s, d) => s + d.contributionCount, 0)
            , 0);

            return {
              user: {
                contributionsCollection: {
                  contributionCalendar: {
                    totalContributions,
                    weeks
                  },
                  totalCommitContributions: Math.floor(totalContributions * 0.8),
                  totalPullRequestContributions: Math.floor(totalContributions * 0.12),
                  totalIssueContributions: Math.floor(totalContributions * 0.05),
                  totalRepositoryContributions: 8
                }
              }
            };
          }

          // Generate Statistics Card SVG
          function generateStatsSvg(stats) {
            return `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" fill="none">
            <defs>
              <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0b0f19" />
                <stop offset="100%" stop-color="#111827" />
              </linearGradient>
              <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ff79c6" />
                <stop offset="100%" stop-color="#bd93f9" />
              </linearGradient>
            </defs>
            <style>
              .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: url(#text-grad); }
              .stat-label { font: 500 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
              .stat-value { font: 600 15px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58a6ff; }
              .stat-icon { fill: #58a6ff; }
              .card {
                fill: url(#card-grad);
                stroke: #30363d;
                stroke-width: 1.5;
                rx: 8px;
              }
            </style>

            <rect x="1" y="1" width="478" height="218" class="card" />

            <text x="25" y="35" class="header">GitHub Stats &amp; Contributions</text>

            <!-- Total Contributions -->
            <g transform="translate(25, 60)">
              <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16">
                <path class="stat-icon" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z" />
              </svg>
              <text x="30" y="13" class="stat-label">Total Contributions</text>
              <text x="450" y="13" class="stat-value" text-anchor="end">${formatNumber(stats.totalContributions)}</text>
            </g>

            <!-- Commits -->
            <g transform="translate(25, 90)">
              <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16">
                <path class="stat-icon" d="M10.5 7.75a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm5.25.75a.75.75 0 0 0 0-1.5h-4.5a3.99 3.99 0 0 0-7.5 0h-.5a.75.75 0 0 0 0 1.5h.5a3.99 3.99 0 0 0 7.5 0h4.5Z" />
              </svg>
              <text x="30" y="13" class="stat-label">Commits</text>
              <text x="450" y="13" class="stat-value" text-anchor="end">${formatNumber(stats.commits)}</text>
            </g>

            <!-- Pull Requests -->
            <g transform="translate(25, 120)">
              <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16">
                <path class="stat-icon" d="M7.177 3.073L9.573.677A.25.25 0 0 1 10 .854v4.792a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm-2.25.75a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm1.5 8a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm11.25-8a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm-2.25.75a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 11.5 3.25Zm1.5 8a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z" />
              </svg>
              <text x="30" y="13" class="stat-label">Pull Requests</text>
              <text x="450" y="13" class="stat-value" text-anchor="end">${formatNumber(stats.pullRequests)}</text>
            </g>

            <!-- Issues -->
            <g transform="translate(25, 150)">
              <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16">
                <path class="stat-icon" d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z" />
              </svg>
              <text x="30" y="13" class="stat-label">Issues</text>
              <text x="450" y="13" class="stat-value" text-anchor="end">${formatNumber(stats.issues)}</text>
            </g>

            <!-- Repositories -->
            <g transform="translate(25, 180)">
              <svg x="0" y="0" width="16" height="16" viewBox="0 0 16 16">
                <path class="stat-icon" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 1 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 0 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1v9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 0 1 1-1Zm-4.75 3a.75.75 0 0 0 0 1.5h3.5a.75.75 0 0 0 0-1.5ZM7 7.5A.75.75 0 0 0 7.75 7h3.5a.75.75 0 0 0 0 1.5h-3.5A.75.75 0 0 0 7 7.5Z" />
              </svg>
              <text x="30" y="13" class="stat-label">Repository Contributions</text>
              <text x="450" y="13" class="stat-value" text-anchor="end">${formatNumber(stats.repositoryContributions)}</text>
            </g>
          </svg>`;
          }

          // Generate Contribution Calendar Graph SVG
          function generateContributionGraphSvg(weeks, totalContributions) {
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            let lastMonth = -1;
            let lastMonthLabelCol = -10;
            let monthLabels = '';

            weeks.forEach((week, colIndex) => {
              const firstDay = week.contributionDays[0];
              if (firstDay) {
                const date = new Date(firstDay.date);
                const month = date.getMonth();
                if (month !== lastMonth && colIndex - lastMonthLabelCol >= 3) {
                  const x = 30 + colIndex * 13;
                  monthLabels += `<text x="${x}" y="50" class="month-label">${monthNames[month]}</text>`;
                  lastMonth = month;
                  lastMonthLabelCol = colIndex;
                }
              }
            });

            let gridCells = '';
            weeks.forEach((week, colIndex) => {
              week.contributionDays.forEach((day) => {
                const x = 30 + colIndex * 13;
                const y = 62 + day.weekday * 13;
                const count = day.contributionCount;

                let color = '#161b22';
                if (count === 0) color = '#161b22';
                else if (count <= 2) color = '#0e4429';
                else if (count <= 5) color = '#006d32';
                else if (count <= 8) color = '#26a641';
                else color = '#39d353';

                gridCells += `<rect x="${x}" y="${y}" width="10" height="10" rx="2" ry="2" fill="${color}">
                  <title>${count} contributions on ${day.date}</title>
                </rect>\n`;
              });
            });

            return `<svg xmlns="http://www.w3.org/2000/svg" width="735" height="185" viewBox="0 0 735 185" fill="none">
            <defs>
              <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0b0f19" />
                <stop offset="100%" stop-color="#111827" />
              </linearGradient>
              <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ff79c6" />
                <stop offset="100%" stop-color="#bd93f9" />
              </linearGradient>
            </defs>
            <style>
              .header { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: url(#text-grad); }
              .summary-text { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
              .month-label { font: 400 9px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
              .wday-label { font: 400 9px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
              .legend-text { font: 400 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
              .card {
                fill: url(#card-grad);
                stroke: #30363d;
                stroke-width: 1.5;
                rx: 8px;
              }
            </style>

            <rect x="1" y="1" width="733" height="183" class="card" />

            <text x="25" y="30" class="header">Contribution History</text>
            <text x="710" y="30" class="summary-text" text-anchor="end">${formatNumber(totalContributions)} contributions in the last year</text>

            <!-- Month Labels -->
            ${monthLabels}

            <!-- Weekday Labels -->
            <text x="10" y="84" class="wday-label">Mon</text>
            <text x="10" y="110" class="wday-label">Wed</text>
            <text x="10" y="136" class="wday-label">Fri</text>

            <!-- Grid Cells -->
            ${gridCells}

            <!-- Legend -->
            <text x="625" y="168" class="legend-text" text-anchor="end">Less</text>
            <rect x="630" y="159" width="10" height="10" rx="2" ry="2" fill="#161b22" />
            <rect x="643" y="159" width="10" height="10" rx="2" ry="2" fill="#0e4429" />
            <rect x="656" y="159" width="10" height="10" rx="2" ry="2" fill="#006d32" />
            <rect x="669" y="159" width="10" height="10" rx="2" ry="2" fill="#26a641" />
            <rect x="682" y="159" width="10" height="10" rx="2" ry="2" fill="#39d353" />
            <text x="697" y="168" class="legend-text">More</text>
          </svg>`;
          }

          // Update README.md
          function updateReadme() {
            let content = fs.readFileSync(README_PATH, 'utf8');

            const startMarker = '<!-- GITHUB_STATS_START -->';
            const endMarker = '<!-- GITHUB_STATS_END -->';

            const startIndex = content.indexOf(startMarker);
            const endIndex = content.indexOf(endMarker);

            if (startIndex === -1 || endIndex === -1) {
              throw new Error('Stats markers not found in README.md');
            }

            const statsHtml = `<p align="center">
            <img src=".github/assets/github-stats.svg" alt="GitHub Stats" width="480" style="max-width: 100%;" />
          </p>
          <p align="center">
            <img src=".github/assets/github-contribution-graph.svg" alt="GitHub Contribution Graph" width="735" style="max-width: 100%;" />
          </p>`;

            const newContent = content.substring(0, startIndex + startMarker.length) +
                               '\n' + statsHtml + '\n' +
                               content.substring(endIndex);

            fs.writeFileSync(README_PATH, newContent, 'utf8');
            console.log('Successfully updated README.md');
          }

          async function main() {
            const token = process.env.GITHUB_TOKEN;
            let rawData;

            if (token) {
              console.log('Fetching live stats from GitHub GraphQL API...');
              try {
                rawData = await fetchGithubData(USERNAME, token);
              } catch (err) {
                console.error('Error fetching live data:', err.message);
                process.exit(1);
              }
            } else {
              console.log('GITHUB_TOKEN not found. Running in MOCK/DEMO mode.');
              rawData = generateMockData();
            }

            const collection = rawData.user.contributionsCollection;
            const calendar = collection.contributionCalendar;

            const stats = {
              totalContributions: calendar.totalContributions,
              commits: collection.totalCommitContributions,
              pullRequests: collection.totalPullRequestContributions,
              issues: collection.totalIssueContributions,
              repositoryContributions: collection.totalRepositoryContributions
            };

            fs.mkdirSync(ASSETS_DIR, { recursive: true });

            const statsSvg = generateStatsSvg(stats);
            const graphSvg = generateContributionGraphSvg(calendar.weeks, calendar.totalContributions);

            fs.writeFileSync(path.join(ASSETS_DIR, 'github-stats.svg'), statsSvg, 'utf8');
            fs.writeFileSync(path.join(ASSETS_DIR, 'github-contribution-graph.svg'), graphSvg, 'utf8');
            console.log('Saved SVGs to .github/assets/');

            updateReadme();
          }

          main().catch(err => {
            console.error('Error during execution:', err);
            process.exit(1);
          });
          EOF

          node temp_update.js
          rm temp_update.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub statistics and contribution graph"
            git push
          fi
